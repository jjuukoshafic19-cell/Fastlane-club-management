
<!DOCTYPE html>
<html>
<head>
    <title>FASTLANE - Edit Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #101820;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #00e676;
            text-align: center;
        }

        form {
            background: #1e2b36;
            padding: 20px;
            border-radius: 12px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #00c853;
            border: none;
            border-radius: 7px;
            font-weight: bold;
        }

        a {
            display: block;
            color: #00e676;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>EDIT PLAYER</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            value="{{ player[1] }}"
            placeholder="Player name"
            required
        >

        <input
            type="number"
            name="age"
            value="{{ player[2] }}"
            placeholder="Age"
            required
        >

        <input
            type="text"
            name="phone"
            value="{{ player[3] }}"
            placeholder="Phone number"
        >

        <select name="sport" required>
            <option value="Football" {% if player[4] == 'Football' %}selected{% endif %}>Football</option>
            <option value="Basketball" {% if player[4] == 'Basketball' %}selected{% endif %}>Basketball</option>
            <option value="Volleyball" {% if player[4] == 'Volleyball' %}selected{% endif %}>Volleyball</option>
            <option value="FreeSE B" {% if player[4] == 'FreeSE B' %}selected{% endif %}>FreeSE B</option>
            <option value="Other" {% if player[4] == 'Other' %}selected{% endif %}>Other</option>
        </select>

        <button type="submit">SAVE CHANGES</button>

    </form>

    <a href="/players-list">BACK TO PLAYERS</a>

</body>
</html>
