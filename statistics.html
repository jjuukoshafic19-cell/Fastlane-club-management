
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FASTLANE Statistics</title>

    <style>
        body {
            background: #10131a;
            color: white;
            font-family: Arial;
            padding: 20px;
        }

        h1 { color: #e5ad35; }

        .card {
            background: #202938;
            padding: 20px;
            margin: 14px 0;
            border-radius: 12px;
            border-left: 4px solid #e5ad35;
        }

        .number {
            font-size: 30px;
            color: #e5ad35;
            font-weight: bold;
        }

        a { color: #e5ad35; }
    </style>
</head>

<body>

<h1>FASTLANE</h1>
<h2>Club Statistics</h2>

<div class="card">
    <h3>Total Players</h3>
    <div class="number">{{ total }}</div>
</div>

<div class="card">
    <h3>Football</h3>
    <div class="number">{{ football }}</div>
</div>

<div class="card">
    <h3>Basketball</h3>
    <div class="number">{{ basketball }}</div>
</div>

<div class="card">
    <h3>Volleyball</h3>
    <div class="number">{{ volleyball }}</div>
</div>

<div class="card">
    <h3>FreeSE B</h3>
    <div class="number">{{ freezeb }}</div>
</div>

<a href="/">Back to Dashboard</a>

</body>
</html>
