
<!DOCTYPE html>
<html>
<head>
    <title>FASTLANE Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #101820;
            color: white;
            font-family: Arial;
            padding: 15px;
        }

        h1 {
            text-align: center;
            color: #00e676;
        }

        .card {
            background: #263746;
            padding: 22px;
            margin: 15px 0;
            border-radius: 12px;
            text-align: center;
        }

        .number {
            font-size: 35px;
            color: #00e676;
            font-weight: bold;
        }

        a {
            display: block;
            background: #00c853;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            font-weight: bold;
        }

        .logout {
            background: #d32f2f;
        }
    </style>
</head>

<body>

<h1>⚡ FASTLANE ADMIN</h1>

<p style="text-align:center;">
    Welcome, {{ session.get('admin_username') }}
</p>

<div class="card">
    <h3>Total Players</h3>
    <div class="number">{{ players }}</div>
</div>

<div class="card">
    <h3>Total Teams</h3>
    <div class="number">{{ teams }}</div>
</div>

<div class="card">
    <h3>Total Games</h3>
    <div class="number">{{ games }}</div>
</div>

<div class="card">
    <h3>Total Admins</h3>
    <div class="number">{{ admins }}</div>
</div>

<a href="/players-list">MANAGE PLAYERS</a>
<a href="/teams-list">MANAGE TEAMS</a>
<a href="/games-list">MANAGE GAMES</a>
<a href="/statistics">VIEW STATISTICS</a>
<a href="/">MAIN DASHBOARD</a>

<a href="/admin-logout" class="logout">LOG OUT</a>

<a href="/create-admin">ADD NEW ADMIN</a>

</body>
</html>
