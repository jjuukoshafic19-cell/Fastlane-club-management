
<!DOCTYPE html>
<html>
<head>
    <title>Attendance Statistics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #00e5a0;
            text-align: center;
        }

        .card {
            background: #1e293b;
            padding: 22px;
            margin: 15px 0;
            border-radius: 12px;
            text-align: center;
        }

        .number {
            color: #00e5a0;
            font-size: 35px;
            font-weight: bold;
        }

        a {
            display: block;
            background: #00a878;
            color: white;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<h1>📊 ATTENDANCE STATISTICS</h1>

<div class="card">
    <h3>Total Records</h3>
    <div class="number">{{ total }}</div>
</div>

<div class="card">
    <h3>Present</h3>
    <div class="number">{{ present }}</div>
</div>

<div class="card">
    <h3>Absent</h3>
    <div class="number">{{ absent }}</div>
</div>

<div class="card">
    <h3>Late</h3>
    <div class="number">{{ late }}</div>
</div>

<a href="/">🏠 DASHBOARD</a>

</body>
</html>
