
<!DOCTYPE html>
<html>
<head>
    <title>Match Statistics - FASTLANE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: #101820;
            color: white;
            font-family: Arial;
            padding: 20px;
        }
        h2 { color: #00e676; }
        .stat {
            background: #263746;
            padding: 20px;
            margin: 12px 0;
            border-radius: 10px;
        }
        .number {
            font-size: 28px;
            color: #00e676;
            font-weight: bold;
        }
        a { color: #00e676; }
    </style>
</head>
<body>

<h2>🏆 MATCH STATISTICS</h2>

<div class="stat">
    Total Matches
    <p class="number">{{ total }}</p>
</div>

<div class="stat">
    Completed Matches
    <p class="number">{{ completed }}</p>
</div>

<div class="stat">
    Scheduled Matches
    <p class="number">{{ scheduled }}</p>
</div>

<div class="stat">
    Live Matches
    <p class="number">{{ live }}</p>
</div>

<div class="stat">
    Total Goals Scored
    <p class="number">{{ goals }}</p>
</div>

<br>
<a href="/">Back to Dashboard</a>

</body>
</html>
