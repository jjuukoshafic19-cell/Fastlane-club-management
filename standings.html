
<!DOCTYPE html>
<html>
<head>
    <title>FASTLANE - Standings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #101820;
            color: white;
            font-family: Arial, sans-serif;
            padding: 15px;
        }

        h1 {
            color: #00e676;
            text-align: center;
        }

        .table-box {
            background: #1e2b36;
            padding: 12px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th, td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid #40515e;
        }

        th {
            color: #00e676;
        }

        td:first-child {
            text-align: left;
        }

        a {
            display: inline-block;
            background: #00c853;
            color: black;
            padding: 12px;
            margin: 15px 5px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🏆 TEAM STANDINGS</h1>

    <div class="table-box">
        <table>
            <tr>
                <th>TEAM</th>
                <th>SPORT</th>
                <th>MP</th>
                <th>W</th>
                <th>D</th>
                <th>L</th>
                <th>PTS</th>
            </tr>

            {% for team in standings %}
            <tr>
                <td>{{ team.team }}</td>
                <td>{{ team.sport }}</td>
                <td>{{ team.played }}</td>
                <td>{{ team.wins }}</td>
                <td>{{ team.draws }}</td>
                <td>{{ team.losses }}</td>
                <td><strong>{{ team.points }}</strong></td>
            </tr>
            {% endfor %}

            {% if not standings %}
            <tr>
                <td colspan="7">No completed matches yet.</td>
            </tr>
            {% endif %}
        </table>
    </div>

    <a href="/">HOME</a>
    <a href="/games-list">MATCHES</a>

</body>
</html>
