
<!DOCTYPE html>
<html>
<head>
    <title>FASTLANE - Players</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #101820;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #00e676;
            text-align: center;
        }

        .player {
            background: #1e2b36;
            padding: 18px;
            margin: 15px 0;
            border-radius: 10px;
        }

        .player h2 {
            color: #00e676;
        }

        button {
            background: #e53935;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
        }

        a {
            display: block;
            background: #00c853;
            color: black;
            padding: 14px;
            text-align: center;
            text-decoration: none;
            border-radius: 7px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>FASTLANE PLAYERS</h1>

    {% for player in players %}
    <a href="/player-profile/{{ player[0] }}">👤 View Full Profile</a>

        <div class="player">

            <h2>{{ player[1] }}</h2>

            <p>Player ID: {{ player[0] }}</p>
            <p>Age: {{ player[2] }}</p>
            <p>Phone: {{ player[3] }}</p>
            <p>Sport: {{ player[4] }}</p>

            <form method="POST"
                  action="/delete-player/{{ player[0] }}"
                  onsubmit="return confirm('Are you sure you want to delete this player?');">

                <button type="submit">DELETE PLAYER</button>

            </form>

        </div>

    {% else %}

        <p>No players registered yet.</p>

    {% endfor %}

    <a href="/players">REGISTER NEW PLAYER</a>

    <a href="/">BACK TO DASHBOARD</a>

</body>
</html>
